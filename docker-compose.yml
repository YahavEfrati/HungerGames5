services:

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cpp-server:
    build:
      context: .
      dockerfile: src/cpp-server/Dockerfile
    env_file:
      - config/.env
    command: server ${CPP_SERVER_PORT:-8080}
    ports:
      - "${CPP_SERVER_PORT:-8080}:${CPP_SERVER_PORT:-8080}"
    volumes:
      - ./data:/usr/src/HungerGames/data

  web-js-server:
    build:
      context: ./src/web_js_server
      dockerfile: Dockerfile.node
    ports:
      - "${NODE_PORT:-3000}:${NODE_PORT:-3000}"
    env_file:
      - config/.env
    depends_on:
      - cpp-server
      - mongodb

  wolt-app:
    build:
      context: ./src/wolt-app
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./src/wolt-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - EXPO_PUBLIC_API_URL=http://localhost:${NODE_PORT:-3000}/api
    depends_on:
      - web-js-server
      - cpp-server

  tests:
    build: 
      context: .
      dockerfile: src/cpp-server/Dockerfile
    command: tests
    profiles: ["testing"]

volumes:  
  mongo_data: